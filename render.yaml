services:
  - type: web
    name: stockocc
    runtime: node
    plan: free
    region: frankfurt    # plus proche de la Tunisie
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SECRET
        generateValue: true   # Render génère une clé aléatoire automatiquement
      - key: DB_PATH
        value: /opt/render/project/src/data.db
