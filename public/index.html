<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Occasion</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stock Occ">
<meta name="theme-color" content="#0F5E5C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --ink:#131C26;--ink-2:#4A5765;--ink-3:#8592A0;
  --paper:#E7EBEF;--surface:#FFFFFF;--line:#D9DFE5;
  --teal:#0F5E5C;--teal-soft:#E2F0EE;
  --amber:#B4791A;--amber-soft:#FBF0DC;
  --clay:#A93826;--clay-soft:#FAE7E3;
  --violet:#4A3D8F;--radius:14px;--tap:48px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;background:#C9D1D8;color:var(--ink);font-size:16px;line-height:1.45;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;}
.mono{font-family:'DM Mono',ui-monospace,monospace;font-variant-ligatures:none}
#frame{width:100%;max-width:430px;height:100vh;height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column;overflow:hidden;}
@media(min-width:900px){body{padding:28px 0;align-items:center}#frame{height:900px;min-height:0;border-radius:34px;box-shadow:0 30px 70px rgba(19,28,38,.28);border:1px solid #B7C0C9}}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 14px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.logo{height:26px;width:auto;display:block}
.hdr-right{margin-left:auto;display:flex;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px;cursor:pointer;}
.chip .dot{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.chip.role{background:var(--ink);color:#fff;border-color:var(--ink)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px;-webkit-overflow-scrolling:touch}
.screen{display:none;animation:in .18s ease-out}
.screen.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pad{padding:0 14px}
h1{font-size:23px;line-height:1.15;letter-spacing:-.02em;margin:18px 0 2px;font-weight:700}
h2{font-size:15px;margin:22px 0 8px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 14px}
.hero{margin:12px 14px 0;background:var(--teal);border-radius:var(--radius);padding:14px;color:#fff;}
.hero p{margin:0 0 10px;font-size:13.5px;color:#B9DAD7}
.imei-bar{display:flex;gap:8px}
.imei-bar input{flex:1;min-width:0;height:var(--tap);border:0;border-radius:10px;padding:0 12px;font-family:'DM Mono',monospace;font-size:15px;letter-spacing:.04em;color:var(--ink);}
.imei-bar input::placeholder{color:#9AA6B2;letter-spacing:.04em}
.scan{width:var(--tap);height:var(--tap);border-radius:10px;border:0;background:#0A4645;color:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;}
.scan svg{width:22px;height:22px}
.stats{display:flex;gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;margin:14px 14px 0}
.stat{flex:1;background:var(--surface);padding:11px 10px}
.stat .v{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.2}
.stat .l{font-size:11.5px;color:var(--ink-3);line-height:1.3;display:block;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 14px 0}
.action{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px;text-align:left;cursor:pointer;font:inherit;color:inherit;display:flex;flex-direction:column;gap:6px;min-height:84px;}
.action:active{background:#F4F7F9}
.action svg{width:21px;height:21px;stroke:var(--teal)}
.action b{font-size:14.5px;font-weight:600}
.action span{font-size:12px;color:var(--ink-3);line-height:1.3}
.list{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:10px}
.row{display:flex;gap:11px;align-items:stretch;padding:11px 14px 11px 0;border-bottom:1px solid #EDF1F4;cursor:pointer;position:relative;}
.row:last-child{border-bottom:0}
.row:active{background:#F4F7F9}
.grade{width:4px;flex-shrink:0;border-radius:0 3px 3px 0}
.g-A{background:var(--teal)}.g-B{background:var(--amber)}.g-C{background:var(--clay)}.g-N{background:var(--violet)}
.row-body{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;gap:6px;align-items:baseline}
.row-meta{font-size:12.5px;color:var(--ink-2);margin-top:1px;display:flex;flex-wrap:wrap;gap:4px 9px}
.row-imei{font-size:11.5px;color:var(--ink-3);letter-spacing:.03em;margin-top:3px}
.row-right{text-align:right;flex-shrink:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
.price{font-weight:700;font-size:14.5px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2.5px 7px;border-radius:5px;white-space:nowrap}
.p-stock{background:var(--teal-soft);color:var(--teal)}
.p-test{background:#E8EAF6;color:var(--violet)}
.p-resa{background:var(--amber-soft);color:var(--amber)}
.p-vendu{background:#EDF1F4;color:var(--ink-2)}
.p-alert{background:var(--clay-soft);color:var(--clay)}
.p-sav{background:#FBF0DC;color:var(--amber)}
.filters{display:flex;gap:7px;overflow-x:auto;padding:12px 14px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.f{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;font-family:inherit;}
.f.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{margin:12px 14px 0;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;height:var(--tap);}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:15px;background:transparent;min-width:0}
.search svg{width:18px;height:18px;stroke:var(--ink-3);flex-shrink:0}
.alert{display:flex;gap:10px;padding:11px 12px;border-radius:11px;margin:10px 14px 0;font-size:13.5px;line-height:1.35;align-items:flex-start;}
.alert.warn{background:var(--amber-soft);color:#6E4A0C}
.alert.bad{background:var(--clay-soft);color:#7A2417}
.alert.good{background:var(--teal-soft);color:#0A4645}
.alert svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.alert b{display:block;font-weight:600}
.alert a{color:inherit;font-weight:600;text-decoration:underline;cursor:pointer}
.dback{display:flex;align-items:center;gap:8px;background:transparent;border:0;font:inherit;color:var(--ink-2);padding:14px;cursor:pointer;font-size:14px;font-weight:500;}
.dback svg{width:16px;height:16px}
.dhead{padding:0 14px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.dhead h1{margin:0 0 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:12px 14px 0;overflow:hidden}
.card-h{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;justify-content:space-between}
.kv{display:flex;padding:9px 14px;font-size:14px;border-bottom:1px solid #F0F3F5;gap:12px}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--ink-2);flex:0 0 42%;margin:0;font-size:13.5px}
.kv dd{margin:0;flex:1;text-align:right;font-weight:500}
.locked{color:var(--ink-3);font-style:italic;font-weight:400;font-size:13px}
.warr{display:flex;align-items:center;gap:14px;padding:14px}
.ring{position:relative;width:74px;height:74px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring-c b{font-size:20px;font-weight:700;display:block}
.ring-c span{font-size:10.5px;color:var(--ink-3)}
.warr-t{font-size:14px}
.warr-t b{display:block;font-size:15px;margin-bottom:2px}
.warr-t span{color:var(--ink-2);font-size:13px}
.tl{padding:6px 14px 14px}
.tl-i{display:flex;gap:12px;position:relative;padding-bottom:16px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:'';position:absolute;left:6px;top:16px;bottom:0;width:1.5px;background:var(--line)}
.tl-i:last-child::before{display:none}
.tl-d{width:13px;height:13px;border-radius:50%;border:3px solid var(--surface);background:var(--teal);flex-shrink:0;margin-top:3px;box-shadow:0 0 0 1.5px var(--teal)}
.tl-i.pending .tl-d{background:var(--surface);box-shadow:0 0 0 1.5px var(--ink-3)}
.tl-c{flex:1;font-size:13.5px}
.tl-c b{display:block;font-size:14px;font-weight:600}
.tl-c span{color:var(--ink-2);font-size:12.5px;display:block}
.tl-c em{color:var(--ink-3);font-style:normal;font-size:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:var(--tap);border-radius:11px;border:0;font:inherit;font-size:15px;font-weight:600;cursor:pointer;}
.btn svg{width:18px;height:18px}
.btn-p{background:var(--teal);color:#fff}
.btn-p:active{background:#0A4645}
.btn-s{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn-d{background:var(--ink);color:#fff}
.btn-row{display:flex;gap:10px;margin:14px}
.btn-row .btn{flex:1}
.btn:disabled{opacity:.45;cursor:default}
.field{margin:0 14px 12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;height:var(--tap);border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15.5px;background:var(--surface);color:var(--ink);}
.field textarea{height:76px;padding:11px 12px;resize:none}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
.field .hint{font-size:12px;color:var(--ink-3);margin-top:4px}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;height:46px;border:0;background:transparent;font:inherit;font-size:14.5px;font-weight:600;color:var(--ink-2);cursor:pointer;border-right:1px solid var(--line);}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--teal);color:#fff}
.steps{display:flex;gap:5px;padding:12px 14px 0}
.step{flex:1;height:3px;border-radius:2px;background:var(--line)}
.step.on{background:var(--teal)}
.check{display:flex;align-items:center;gap:11px;padding:12px 14px;background:var(--surface);border-bottom:1px solid #EDF1F4;cursor:pointer;font-size:14.5px;}
.check:last-child{border-bottom:0}
.box{width:23px;height:23px;border:2px solid var(--line);border-radius:6px;flex-shrink:0;display:grid;place-items:center}
.check.ok .box{background:var(--teal);border-color:var(--teal)}
.check.ok .box::after{content:'';width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check small{margin-left:auto;color:var(--ink-3);font-size:12px}
.sig{margin:0 14px;height:96px;border:1.5px dashed var(--line);border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--ink-3);font-size:13px;cursor:pointer;}
.sig.done{border-style:solid;border-color:var(--teal);background:var(--teal-soft);color:var(--teal);font-family:'DM Mono',monospace}
nav{position:absolute;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 0 max(8px,env(safe-area-inset-bottom));}
nav button{flex:1;border:0;background:transparent;font:inherit;cursor:pointer;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;font-weight:600;}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button.on{color:var(--teal)}
.fab{position:absolute;bottom:78px;right:16px;width:56px;height:56px;border-radius:18px;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 18px rgba(19,28,38,.3);}
.fab svg{width:26px;height:26px}
.sheet-bg{position:absolute;inset:0;background:rgba(19,28,38,.5);display:none;z-index:20}
.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 0 max(16px,env(safe-area-inset-bottom));max-height:82%;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.handle{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 14px 10px;font-size:17px;font-weight:700;letter-spacing:-.01em}
.opt{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin:0 14px 9px;cursor:pointer;font:inherit;text-align:left;width:calc(100% - 28px);}
.opt b{display:block;font-size:15px;font-weight:600}
.opt span{font-size:12.5px;color:var(--ink-3);line-height:1.3}
.opt svg{width:22px;height:22px;stroke:var(--teal);flex-shrink:0}
.opt.on{border-color:var(--teal);background:var(--teal-soft)}
.scanview{margin:0 14px 14px;aspect-ratio:4/3;background:#111A22;border-radius:14px;position:relative;overflow:hidden;display:grid;place-items:center;}
.scanview .box2{width:76%;height:34%;border:2px solid #7FC3BF;border-radius:8px;position:relative}
.scanview .laser{position:absolute;left:0;right:0;height:2px;background:#7FC3BF;box-shadow:0 0 12px #7FC3BF;animation:sc 1.8s ease-in-out infinite}
@keyframes sc{0%,100%{top:2px}50%{top:calc(100% - 4px)}}
.note{font-size:12px;color:var(--ink-3);padding:0 14px;margin:8px 0 0;line-height:1.4}
.toast{position:absolute;left:14px;right:14px;bottom:88px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;z-index:30;display:none;align-items:center;gap:9px;}
.toast.on{display:flex;animation:up .2s ease-out}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.err{background:var(--clay)}
.mark{border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;letter-spacing:-.02em;flex-shrink:0}
.auth{padding:0 20px;display:flex;flex-direction:column;min-height:100%}
.auth-top{padding:40px 0 26px;text-align:center}
.auth-top .mark{margin:0 auto 16px}
.auth h1{font-size:25px;margin:0 0 6px}
.auth .sub{font-size:14.5px;margin-bottom:22px}
.pinrow{display:flex;gap:9px;justify-content:center;margin:6px 0 20px}
.pindot{width:46px;height:54px;border:1.5px solid var(--line);border-radius:11px;background:var(--surface);display:grid;place-items:center;font-size:22px;font-weight:700}
.pindot.on{border-color:var(--teal);background:var(--teal-soft);color:var(--teal)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:auto;padding-bottom:18px}
.keys button{height:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font:inherit;font-size:21px;font-weight:600;cursor:pointer;color:var(--ink)}
.keys button:active{background:var(--teal-soft)}
.keys button.blank{border:0;background:transparent;cursor:default}
.swatches{display:flex;gap:9px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:11px;cursor:pointer;border:3px solid transparent}
.sw.on{border-color:var(--ink)}
.upload{display:flex;align-items:center;gap:13px;background:var(--surface);border:1.5px dashed var(--line);border-radius:12px;padding:13px;cursor:pointer}
.upload.done{border-style:solid;border-color:var(--teal)}
.upload div{flex:1}
.upload b{display:block;font-size:14.5px}
.upload span{font-size:12.5px;color:var(--ink-3)}
.prev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:10px}
.p-essai{background:#E8EAF6;color:var(--violet)}
.p-attente{background:var(--amber-soft);color:var(--amber)}
.p-susp{background:var(--clay-soft);color:var(--clay)}
.urow{display:flex;gap:11px;align-items:center;padding:12px 14px;border-bottom:1px solid #EDF1F4;cursor:pointer}
.urow:last-child{border-bottom:0}
.urow .av{width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.urow .ub{flex:1;min-width:0}
.urow .ub b{display:block;font-size:15px;font-weight:600}
.urow .ub span{font-size:12.5px;color:var(--ink-2)}
.srow{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid #EDF1F4;cursor:pointer}
.srow:last-child{border-bottom:0}
.srow .sb{flex:1;min-width:0}
.srow .sb b{display:block;font-size:15.5px;font-weight:600;letter-spacing:-.01em}
.srow .sb span{font-size:12.5px;color:var(--ink-2)}
.spin{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:middle}
.spin.dark{border-color:rgba(19,28,38,.2);border-top-color:var(--ink)}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{padding:40px 24px;text-align:center;color:var(--ink-3);font-size:14px}
</style>
</head>
<body>
<div id="frame">
<header id="hdr"></header>
<main id="main">

<section class="screen on" id="s-home">
  <div class="hero">
    <p>Cherche un appareil par IMEI, modèle ou nom du client</p>
    <div class="imei-bar">
      <input class="mono" id="heroSearch" placeholder="35 301211 093284 7" inputmode="numeric" oninput="heroSearchFn(this.value)">
      <button class="scan" onclick="openSheet('scan')" aria-label="Scanner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2M7 12h10"/></svg>
      </button>
    </div>
  </div>
  <div class="stats" id="homeStats"><div class="stat"><span class="v"><span class="spin dark"></span></span><span class="l">Chargement…</span></div></div>
  <div id="homeAlerts"></div>
  <div class="actions" id="homeActions"></div>
  <div class="pad"><h2 id="homeListTitle">Derniers mouvements</h2></div>
  <div class="list" id="homeList"></div>
</section>

<section class="screen" id="s-stock">
  <div class="pad"><h1>Stock</h1></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="stockSearch" placeholder="IMEI, modèle, client…" oninput="renderStock()">
  </div>
  <div class="filters" id="stockFilters"></div>
  <div class="list" id="stockList"></div>
  <p class="note" id="stockNote"></p>
</section>

<section class="screen" id="s-device">
  <button class="dback" onclick="go(backTo)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Retour
  </button>
  <div id="deviceBody"></div>
</section>

<section class="screen" id="s-acq">
  <div class="steps"><div class="step on" id="ast1"></div><div class="step" id="ast2"></div><div class="step" id="ast3"></div></div>
  <div id="acqBody"></div>
</section>

<section class="screen" id="s-sale">
  <div class="steps"><div class="step on" id="vst1"></div><div class="step" id="vst2"></div></div>
  <div id="saleBody"></div>
</section>

<section class="screen" id="s-warranty">

  <div class="search">

    <input id="warSearch" class="mono" placeholder="IMEI ou n° de bon" oninput="renderWarranty()">
  </div>
  <div id="warBody"></div>

  <div class="pad"><h2>Droits par rôle</h2></div>

  <div id="obBody"></div>
</section>

  <button class="dback" onclick="go('more')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Réglages</button>

</section>

</main>

<button class="fab" id="fab" onclick="openSheet('new')" aria-label="Nouvel enregistrement">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav id="nav"></nav>

<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg>
  <span id="toastMsg"></span>
</div>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()">
  <div class="sheet" id="sheet" onclick="event.stopPropagation()"></div>
</div>

</div>
<script>
/* ========================================================
   COUCHE API
   ======================================================== */
let TOKEN = localStorage.getItem('so_token') || '';
let ME = null; // résultat de /api/me

async function apiFetch(method, path, body){
  const opts = {
    method,
    headers: { 'Content-Type':'application/json', ...(TOKEN ? {'Authorization':'Bearer '+TOKEN} : {}) }
  };
  if(body) opts.body = JSON.stringify(body);
  try {
    const r = await fetch(path, opts);
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || data.message || 'Erreur '+r.status);
    return data;
  } catch(e) {
    throw e;
  }
}
const api = {
  get: p => apiFetch('GET', p),
  post: (p,b) => apiFetch('POST', p, b),
};

/* ========================================================
   ÉTAT GLOBAL
   ======================================================== */
const ST = {
  stock:{l:"En stock",c:"p-stock"}, test:{l:"À tester",c:"p-test"},
  reserve:{l:"Réservé",c:"p-resa"}, vendu:{l:"Vendu",c:"p-vendu"},
  bloque:{l:"iCloud bloqué",c:"p-alert"}, sav:{l:"En SAV",c:"p-sav"}
};
const ROLES = {
  vendeur:{name:"Vendeur",tabs:["home","stock","warranty","more"],cost:false,margin:false,team:false},
  stock:{name:"Resp. stock",tabs:["home","stock","warranty","more"],cost:true,margin:false,team:false},
  gerant:{name:"Gérant",tabs:["home","stock","reports","more"],cost:true,margin:true,team:true},
  proprio:{name:"Propriétaire",tabs:["home","stock","reports","more"],cost:true,margin:true,team:true},
  editeur:{name:"Éditeur",tabs:["admin"],cost:true,margin:true,team:true}
};
const RANK = {vendeur:1,stock:2,gerant:3,proprio:4,editeur:5};
const TST = {actif:{l:"Actif",c:"p-stock"},essai:{l:"Essai",c:"p-essai"},attente:{l:"En attente",c:"p-attente"},attente_paiement:{l:"En attente",c:"p-attente"},suspendu:{l:"Suspendu",c:"p-susp"},ferme:{l:"Fermé",c:"p-alert"}};

let cur = 'auth', backTo = 'home', MODE = 'auth';
let stockFilter = 'all', stockDevices = [];
let acqStep = 1, saleStep = 1, saleDevId = null;
let acqData = {imei:'',brand:'',model:'',color:'',storage:'128 Go',grade:'A',batt:'',
               src:'particulier',checks:{ecran:1,tactile:1,faceid:1,cam:1,charge:1,son:0},
               sig:false,seller_name:'',seller_phone:'',id_type:'cin',id_number:'',
               supplier_name:'',invoice_ref:'',buy_price:'',sell_price:'',warranty_months:3,pdv_id:''};
let saleData = {client_name:'',client_phone:'',warranty_months:3,price:'',discount:0,payment:'especes'};
let pinBuffer = '', phoneValue = '';
let obStep=1,obCol=0,obPdvs=['Boutique principale'],obName='';
let adFilter='all', shopId=null;
let payMonths=1,payMode=0;
let pdvId = '', pdvName = '';

const $ = id => document.getElementById(id);
const R = () => ROLES[ME?.role || 'vendeur'];
const canDo = min => (RANK[ME?.role||'vendeur']||0) >= (RANK[min]||0);

function dtn(n){
  const p=(Math.round(Number(n)*1000)/1000).toFixed(3).split('.');
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+','+p[1];
}
const dt = n => dtn(n)+' DT';
function fmtDate(s){ if(!s)return '—'; const d=new Date(s); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function initials(n){ const w=(n||'').trim().split(/\s+/).filter(Boolean); return ((w[0]||'?')[0]+((w[1]||'')[0]||'')).toUpperCase()||'?'; }
function mark(color,short,size,fs){ return `<div class="mark" style="width:${size}px;height:${size}px;font-size:${fs}px;background:${color}">${short}</div>`; }

/* ========================================================
   NAVIGATION
   ======================================================== */
const NAVICONS = {
  home:'<path d="M4 11l8-7 8 7v8a2 2 0 01-2 2h-3v-6H9v6H6a2 2 0 01-2-2z"/>',
  stock:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 4v16"/>',
  warranty:'<path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/><path d="M9.5 12l2 2 3.5-4"/>',
  reports:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  more:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1V21a2 2 0 11-4 0v-.1A1.6 1.6 0 007.5 19l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 7.5l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
  admin:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/>'
};
const NAVLABEL = {home:"Accueil",stock:"Stock",warranty:"Garantie",reports:"Rapports",more:"Réglages",admin:"Boutiques"};

function renderNav(){
  const n=$('nav');
  if(MODE!=='app'){n.style.display='none';return;}
  n.style.display='flex';
  const tabs = R().tabs;
  n.innerHTML = tabs.map(t=>`<button class="${cur===t?'on':''}" onclick="go('${t}')">
    <svg viewBox="0 0 24 24">${NAVICONS[t]||NAVICONS.home}</svg>${NAVLABEL[t]||t}</button>`).join('');
}

function go(s){
  cur = s;
  MODE = ['auth','onboard'].includes(s) ? 'auth' : (['admin','shop'].includes(s) ? 'admin' : 'app');
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
  $('s-'+s).classList.add('on');
  $('main').scrollTop=0;
  $('fab').style.display = ['home','stock'].includes(s) ? 'grid':'none';
  if(s==='home') renderHome();
  if(s==='stock') renderStock();
  if(s==='warranty') renderWarranty();
  if(s==='reports') renderReports();
  if(s==='more') renderMore();
  if(s==='acq') renderAcq();
  if(s==='sale') renderSale();
  if(s==='auth') renderAuth();
  if(s==='onboard') renderOnboard();
  if(s==='team') renderTeam();
  if(s==='admin') renderAdmin();
  renderHeader();
  renderNav();
  closeSheet();
}

function toast(m, isErr){
  const el=$('toast'), ic=$('toast').querySelector('svg');
  $('toastMsg').textContent=m;
  el.classList.toggle('err',!!isErr);
  ic.innerHTML = isErr
    ? '<path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/>'
    : '<path d="M20 6L9 17l-5-5"/>';
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2800);
}

/* ========================================================
   HEADER
   ======================================================== */
function renderHeader(){
  const h=$('hdr');
  if(MODE==='auth'){h.style.display='none';return;}
  h.style.display='flex';
  if(MODE==='admin'){
    h.innerHTML=`${mark('#131C26','SO',28,12)}<b style="font-size:15.5px;letter-spacing:-.02em">Console éditeur</b>
      <div class="hdr-right"><button class="chip" onclick="logout()">Déconnexion</button></div>`;
    return;
  }
  const t = ME?.tenant;
  const brand = t
    ? `${mark(t.color||'#0F5E5C', initials(t.name), 28, 12)}<b style="font-size:15.5px;letter-spacing:-.02em">${t.name}</b>`
    : `${mark('#0F5E5C','SO',28,12)}<b style="font-size:15.5px;letter-spacing:-.02em">Stock Occasion</b>`;
  const pdvList = ME?.pdvs || [];
  const pdvBtn = pdvList.length > 1
    ? `<button class="chip" onclick="openSheet('pdv')"><span class="dot"></span>${pdvName||'PDV'}</button>`
    : (pdvName ? `<span class="chip"><span class="dot"></span>${pdvName}</span>` : '');
  h.innerHTML=`${brand}
    <div class="hdr-right">
      ${pdvBtn}
      <button class="chip role" onclick="void 0">${R().name}</button>
      <button class="chip" onclick="logout()">⏻</button>
    </div>`;
}

/* ========================================================
   AUTH — LOGIN
   ======================================================== */
function renderAuth(){
  $('authBody').innerHTML=`<div class="auth">
    <div class="auth-top">
      <div class="mark" style="width:58px;height:58px;font-size:22px;background:var(--teal)">SO</div>
      <h1>Stock Occasion</h1>
      <p class="sub">Entre ton numéro, puis ton code à 4 chiffres.</p>
    </div>
    <div class="field" style="margin:0 0 16px"><label>Numéro de téléphone</label>
      <input id="loginPhone" inputmode="tel" placeholder="20 000 000" value="${phoneValue}" oninput="phoneValue=this.value;pinBuffer='';renderPinDots()">
    </div>
    <div class="pinrow" id="pinDots">${[0,1,2,3].map(i=>`<div class="pindot">&nbsp;</div>`).join('')}</div>
    <p class="note" style="text-align:center;padding:0">Ton numéro est ton identifiant dans la boutique.</p>
    <div class="keys" id="pinKeys">
      ${[1,2,3,4,5,6,7,8,9].map(k=>`<button onclick="pinKey('${k}')">${k}</button>`).join('')}
      <button class="blank"></button>
      <button onclick="pinKey('0')">0</button>
      <button onclick="pinKey('back')">⌫</button>
    </div>
    <div class="btn-row" style="margin:0 0 20px">
      <button class="btn btn-s" onclick="go('onboard')">Créer ma boutique</button>
    </div>
  </div>`;
}

function renderPinDots(){
  const dots = $('pinDots');
  if(!dots) return;
  dots.innerHTML = [0,1,2,3].map(i=>`<div class="pindot ${i<pinBuffer.length?'on':''}">${i<pinBuffer.length?'•':''}</div>`).join('');
}

function pinKey(k){
  if(k==='back'){ pinBuffer=pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer += k;
  renderPinDots();
  if(pinBuffer.length===4) doLogin();
}

async function doLogin(){
  const phone = ($('loginPhone')||{}).value || phoneValue;
  const pin = pinBuffer;
  pinBuffer='';
  try {
    const data = await api.post('/api/login', {phone: phone.replace(/\s/g,''), pin});
    TOKEN = data.token;
    localStorage.setItem('so_token', TOKEN);
    await loadMe();
    const firstTab = R().tabs[0];
    go(firstTab);
    toast('Connecté — ' + (ME?.name||''));
  } catch(e) {
    renderPinDots();
    toast(e.message || 'Code incorrect', true);
  }
}

async function loadMe(){
  try {
    ME = await api.get('/api/me');
    // Set default PDV
    if(ME.pdvs && ME.pdvs.length>0 && !pdvId){
      pdvId = ME.pdvs[0].id;
      pdvName = ME.pdvs[0].name;
    }
    // Apply brand color
    if(ME.tenant?.color){
      document.documentElement.style.setProperty('--teal', ME.tenant.color);
      document.documentElement.style.setProperty('--teal-soft', ME.tenant.soft_color||'#E2F0EE');
    }
  } catch(e){
    // Token invalide ou expiré — on efface et on retourne à l'auth
    TOKEN=''; localStorage.removeItem('so_token'); ME=null;
    pdvId=''; pdvName='';
  }
}

function logout(){
  TOKEN=''; ME=null; pdvId=''; pdvName=''; phoneValue=''; pinBuffer='';
  localStorage.removeItem('so_token');
  go('auth');
}

/* ========================================================
   HOME
   ======================================================== */
async function renderHome(){
  // Stats + quick actions using real device data
  try {
    const devs = await api.get('/api/devices');
    const all = devs.devices || devs;
    const inStock = all.filter(d=>d.status==='stock'||d.status==='reserve');
    const toTest  = all.filter(d=>d.status==='test');
    const sold    = all.filter(d=>d.status==='vendu');
    const val     = inStock.reduce((s,d)=>s+(Number(d.buy_price)||0),0);

    let stats;
    if(ME?.role==='vendeur')
      stats=[[inStock.length,"En stock"],[sold.length,"Vendus"],[all.filter(d=>d.status==='reserve').length,"Réservés"]];
    else if(ME?.role==='stock')
      stats=[[inStock.length,"En stock"],[toTest.length,"À tester"],[all.filter(d=>d.status==='bloque').length,"Bloqués"]];
    else
      stats=[[dtn(val).replace(',000',''),"Valeur stock (DT)"],[inStock.length,"En stock"],[sold.length,"Vendus (total)"]];

    $('homeStats').innerHTML = stats.map(s=>`<div class="stat"><span class="v">${s[0]}</span><span class="l">${s[1]}</span></div>`).join('');

    // Alerts
    const locked = all.filter(d=>d.icloud_status==='bloque'&&d.status!=='vendu');
    const dormant = all.filter(d=>d.status==='stock'&&d.age_days>60);
    let al='';
    if(locked.length) al+=`<div class="alert bad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 17h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><div><b>${locked.length} appareil(s) iCloud bloqué(s)</b>Ne pas régler le(s) vendeur(s). <a onclick="stockFilter='bloque';go('stock')">Voir</a></div></div>`;
    if(dormant.length&&canDo('gerant')) al+=`<div class="alert warn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div><b>${dormant.length} appareils dormants (&gt;60 jours)</b><a onclick="stockFilter='dormant';go('stock')">Les voir</a></div></div>`;
    $('homeAlerts').innerHTML=al;

    // Actions
    const cart='<path d="M6 2l1.5 5h13L19 16H8L6 2zM9 21h.01M18 21h.01"/>',plus='<path d="M12 5v14M5 12h14"/>',
          shield='<path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/>',chart='<path d="M4 20V10M10 20V4M16 20v-7"/>';
    const A=(fn,ic,t,s)=>`<button class="action" onclick="${fn}"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round">${ic}</svg><b>${t}</b><span>${s}</span></button>`;
    let acts='';
    acts += A("startSale()",cart,"Vendre","Encaisser et éditer le bon");
    acts += A("startAcq()",plus,"Entrée de stock","Achat ou reprise");
    acts += A("go('warranty')",shield,"Garantie","Vérifier par IMEI");
    if(canDo('gerant')) acts += A("go('reports')",chart,"Rapports","Marges et CA");
    $('homeActions').innerHTML=acts;

    // Recent list
    $('homeListTitle').textContent = canDo('stock') ? 'Entrées récentes' : 'Derniers mouvements';
    const recent = all.slice(0,6);
    $('homeList').innerHTML = recent.length ? recent.map(rowHTML).join('') : '<div class="empty">Aucun appareil en stock.</div>';

  } catch(e){
    const msg = e.message||'';
    const isAuth = msg.includes('401')||msg.includes('token')||msg.includes('auth')||msg.toLowerCase().includes('pattern');
    if(isAuth){ logout(); return; }
    $('homeStats').innerHTML=`<div class="stat"><span class="v" style="font-size:13px;color:var(--clay)">!</span><span class="l">${msg||'Erreur réseau'}</span></div>`;
  }
}

function heroSearchFn(v){
  if(v.length>=3){ stockFilter='all'; $('stockSearch').value=v; go('stock'); }
}

/* ========================================================
   STOCK
   ======================================================== */
const FILTERS=[["all","Tous"],["stock","En stock"],["test","À tester"],["reserve","Réservés"],["dormant","Dormants"],["vendu","Vendus"],["bloque","Bloqués"]];

async function renderStock(){
  $('stockFilters').innerHTML=FILTERS.map(f=>`<button class="f ${stockFilter===f[0]?'on':''}" onclick="stockFilter='${f[0]}';renderStock()">${f[1]}</button>`).join('');
  $('stockList').innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  try {
    const q = ($('stockSearch').value||'').trim();
    const params = new URLSearchParams();
    if(q) params.set('q',q);
    if(stockFilter!=='all'&&stockFilter!=='dormant') params.set('status',stockFilter);
    const res = await api.get('/api/devices?'+params.toString());
    let list = res.devices || res;
    if(stockFilter==='dormant') list = list.filter(d=>d.age_days>60&&d.status==='stock');
    stockDevices = list;
    const v = list.filter(d=>d.status!=='vendu').reduce((s,d)=>s+(Number(d.buy_price)||0),0);
    $('stockNote').textContent = canDo('stock') ? `${list.length} appareil(s) · ${dt(v)} immobilisés` : `${list.length} appareil(s)`;
    $('stockList').innerHTML = list.length ? list.map(rowHTML).join('') : '<div class="empty">Aucun appareil ne correspond.</div>';
  } catch(e){
    $('stockList').innerHTML=`<div class="empty">${e.message}</div>`;
  }
}

/* ========================================================
   ROW HTML
   ======================================================== */
function rowHTML(d){
  const st = d.status || d.st || 'stock';
  const stObj = ST[st]||{l:st,c:'p-vendu'};
  const grade = d.grade||'B';
  const gc = d.is_new ? 'g-N':'g-'+grade;
  const vente = d.sell_price||d.vente||0;
  const achat = d.buy_price||d.achat||0;
  const repa  = d.repair_cost||d.repa||0;
  const marge = vente-achat-repa;
  let right='';
  if(canDo('gerant')&&vente) right=`<span class="price">${dt(vente)}</span><span class="price" style="font-weight:600;color:var(--teal);font-size:12.5px">+${dtn(marge).replace(',000','')}</span>`;
  else if(vente) right=`<span class="price">${dt(vente)}</span>${canDo('stock')?`<span class="price" style="font-weight:500;color:var(--ink-3);font-size:12px">achat ${dtn(achat)}</span>`:''}`;
  else right=`<span class="price" style="color:var(--ink-3);font-size:12.5px">—</span>`;
  return `<div class="row" onclick="openDevice(${d.id})">
    <div class="grade ${gc}"></div>
    <div class="row-body">
      <div class="row-title">${d.brand||''} ${d.model||d.m||''} <span style="font-weight:500;color:var(--ink-2);font-size:13px">${d.storage||d.cap||''} · ${d.color||d.col||''}</span></div>
      <div class="row-meta"><span class="pill ${stObj.c}">${stObj.l}</span><span>Grade ${grade}</span><span>Batt. ${d.battery_health||d.batt||'?'} %</span></div>
      <div class="row-imei mono">${d.imei||''}</div>
    </div>
    <div class="row-right">${right}</div>
  </div>`;
}

/* ========================================================
   FICHE APPAREIL
   ======================================================== */
async function openDevice(id){
  backTo = ['stock','home','warranty'].includes(cur)?cur:'stock';
  cur = 'device';
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
  $('s-device').classList.add('on');
  $('main').scrollTop=0;
  $('fab').style.display='none';
  $('deviceBody').innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  renderNav();
  try {
    const d = await api.get('/api/devices/'+id);
    const dev = d.device || d;
    const events = d.events || [];
    const st = dev.status||'stock';
    const stObj = ST[st]||{l:st,c:'p-vendu'};
    const vente=dev.sell_price||0, achat=dev.buy_price||0, repa=dev.repair_cost||0;
    const marge=vente-achat-repa;
    let h=`<div class="dhead">
      <h1>${dev.brand||''} ${dev.model||''} ${dev.storage||''}</h1>
      <p class="sub" style="margin:0 0 8px">${dev.color||''} · Grade ${dev.grade||''} · Batterie ${dev.battery_health||'?'} %</p>
      <span class="pill ${stObj.c}">${stObj.l}</span>
    </div>`;

    if(dev.icloud_status==='bloque') h+=`<div class="alert bad" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 8v5M12 17h.01M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg><div><b>Compte iCloud toujours actif</b>Appareil non revendable. Ne pas régler le vendeur.</div></div>`;

    h+=`<div class="card"><div class="card-h">Identité</div>
      <dl class="kv"><dt>IMEI 1</dt><dd class="mono">${dev.imei||'—'}</dd></dl>
      <dl class="kv"><dt>Couleur</dt><dd>${dev.color||'—'}</dd></dl>
      <dl class="kv"><dt>Stockage</dt><dd>${dev.storage||'—'}</dd></dl>
    </div>`;

    h+=`<div class="card"><div class="card-h">Provenance</div>
      <dl class="kv"><dt>Source</dt><dd>${dev.source_type==='particulier'?'Reprise particulier':'Fournisseur'}</dd></dl>
      <dl class="kv"><dt>${dev.source_type==='particulier'?'Vendeur':'Fournisseur'}</dt><dd>${dev.seller_name||dev.supplier_name||'—'}</dd></dl>
      ${dev.id_number?`<dl class="kv"><dt>CIN / Passeport</dt><dd class="mono">${dev.id_number}</dd></dl>`:''}
      <dl class="kv"><dt>Date d'entrée</dt><dd>${fmtDate(dev.created_at)}</dd></dl>
    </div>`;

    h+=`<div class="card"><div class="card-h">Prix</div>
      ${canDo('stock')?`<dl class="kv"><dt>Prix d'achat</dt><dd>${achat?dt(achat):'—'}</dd></dl>
        <dl class="kv"><dt>Réparations</dt><dd>${repa?dt(repa):'—'}</dd></dl>`
      :`<dl class="kv"><dt>Prix d'achat</dt><dd class="locked">Réservé au responsable</dd></dl>`}
      <dl class="kv"><dt>Prix de vente</dt><dd>${vente?dt(vente):'À définir'}</dd></dl>
      ${canDo('gerant')&&vente?`<dl class="kv"><dt>Marge</dt><dd style="color:var(--teal)">${dt(marge)} · ${Math.round(marge/vente*100)} %</dd></dl>`:''}
    </div>`;

    // Timeline
    if(events.length){
      h+=`<div class="card"><div class="card-h">Historique</div><div class="tl">`;
      events.forEach(ev=>{
        h+=`<div class="tl-i"><div class="tl-d"></div><div class="tl-c">
          <b>${ev.event_type||ev.type||''}</b>
          <span>${ev.note||''}</span>
          <em>${fmtDate(ev.created_at)} · ${ev.user_name||''}</em>
        </div></div>`;
      });
      h+=`</div></div>`;
    }

    // Actions
    if(st==='stock') h+=`<div class="btn-row"><button class="btn btn-s" onclick="toast('Fonctionnalité à venir')">Réserver</button><button class="btn btn-p" onclick="saleDevId=${dev.id};startSale()">Vendre</button></div>`;
    else if(st==='test'&&canDo('stock')) h+=`<div class="btn-row"><button class="btn btn-p" onclick="releaseDevice(${dev.id})">Terminer le test — mettre en vente</button></div>`;
    else if(st==='reserve') h+=`<div class="btn-row"><button class="btn btn-s" onclick="toast('Réservation annulée')">Annuler</button><button class="btn btn-p" onclick="saleDevId=${dev.id};startSale()">Finaliser la vente</button></div>`;

    $('deviceBody').innerHTML=h;
  } catch(e){
    $('deviceBody').innerHTML=`<div class="empty">${e.message}</div>`;
  }
}

async function releaseDevice(id){
  try {
    await api.post('/api/devices/'+id+'/release');
    toast('Appareil mis en vente');
    openDevice(id);
  } catch(e){ toast(e.message,true); }
}

async function renderReports(){
  $('repSub').textContent='Chargement…';
  $('repBody').innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  try {
    const res = await api.get('/api/devices');
    const all = res.devices||res;
    const sold = all.filter(d=>d.status==='vendu');
    const ca = sold.reduce((s,d)=>s+(Number(d.sell_price)||0),0);
    const margin = sold.reduce((s,d)=>s+(Number(d.sell_price)||0)-(Number(d.buy_price)||0)-(Number(d.repair_cost)||0),0);
    const inStock = all.filter(d=>['stock','reserve','test'].includes(d.status));
    const val = inStock.reduce((s,d)=>s+(Number(d.buy_price)||0),0);
    $('repSub').textContent=`${sold.length} ventes · tous les points de vente`;
    $('repBody').innerHTML=`
    <div class="stats">
      <div class="stat"><span class="v">${dtn(ca).replace(',000','')}</span><span class="l">CA total (DT)</span></div>
      <div class="stat"><span class="v">${dtn(margin).replace(',000','')}</span><span class="l">Marge (DT)</span></div>
      <div class="stat"><span class="v">${sold.length}</span><span class="l">Vendus</span></div>
    </div>
    <div class="card"><div class="card-h">Stock actuel</div>
      <dl class="kv"><dt>Appareils en stock</dt><dd>${inStock.length}</dd></dl>
      <dl class="kv"><dt>Valeur immobilisée</dt><dd>${dtn(val).replace(',000','')} DT</dd></dl>
      <dl class="kv"><dt>Dormants (&gt;60 jours)</dt><dd>${all.filter(d=>d.status==='stock'&&d.age_days>60).length}</dd></dl>
    </div>
    <div class="card"><div class="card-h">Marge globale</div>
      <dl class="kv"><dt>Marge totale</dt><dd style="color:var(--teal)">${dtn(margin).replace(',000','')} DT</dd></dl>
      <dl class="kv"><dt>Marge moyenne / vente</dt><dd>${sold.length?dtn(margin/sold.length).replace(',000',''):0} DT</dd></dl>
      <dl class="kv"><dt>Taux de marge</dt><dd>${ca?Math.round(margin/ca*100):0} %</dd></dl>
    </div>`;
  } catch(e){ $('repBody').innerHTML=`<div class="empty">${e.message}</div>`; }
}

    <dl class="kv"><dt>Formule</dt><dd>${t.plan||'Essai'}</dd></dl>
    <dl class="kv"><dt>Mon rôle</dt><dd>${R().name}</dd></dl>
  </div>
  <div class="btn-row" style="margin-bottom:0">
    ${canDo('gerant')?`<button class="btn btn-s" onclick="go('team')">Équipe</button>`:''}
    <button class="btn btn-s" onclick="logout()">Déconnexion</button>
  </div>`;

  const P=[
    ["Voir le stock et les prix de vente",1,1,1,1],
    ["Vendre et encaisser",1,1,1,1],
    ["Vérifier une garantie",1,1,1,1],
    ["Saisir une reprise",1,1,1,1],
    ["Valider une entrée en stock",0,1,1,1],
    ["Voir les prix d'achat",0,1,1,1],
    ["Voir les marges et le CA",0,0,1,1],
    ["Inviter et désactiver un utilisateur",0,0,1,1],
    ["Changer la marque / abonnement",0,0,0,1],
  ];
  $('permBody').innerHTML=`<div class="perm" style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin:0 14px 12px;overflow:hidden">
    <div class="perm-h" style="padding:11px 14px;background:#F4F7F9;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center">Droits par rôle<span style="font-size:12px;font-weight:500;color:var(--ink-3)">V · RS · G · P</span></div>
    ${P.map(x=>`<div class="perm-r" style="display:flex;padding:8px 14px;font-size:13.5px;border-bottom:1px solid #F0F3F5;gap:10px;align-items:center"><span style="flex:1">${x[0]}</span>
      ${[1,2,3,4].map(i=>`<b style="width:24px;text-align:center;${x[i]?'color:var(--teal);font-weight:700':'color:var(--ink-3)'}">${x[i]?'✓':'·'}</b>`).join('')}</div>`).join('')}
  </div>
  <p class="note" style="margin-bottom:14px">V vendeur · RS responsable stock · G gérant · P propriétaire.</p>`;
}

/* ========================================================
   ÉQUIPE
   ======================================================== */
async function renderTeam(){
  $('teamBody').innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  try {
    const res = await api.get('/api/users');
    const team = res.users||res;
    $('teamBody').innerHTML=`<div class="pad"><h1>Équipe</h1><p class="sub">${team.length} personnes.</p></div>
    <div class="list">${team.map(u=>`<div class="urow">
      <div class="av">${initials(u.name||u.phone)}</div>
      <div class="ub"><b>${u.name||u.phone}</b><span>${ROLES[u.role]?.name||u.role} · ${u.pdv_name||'Tous les PDV'}</span></div>
      <div style="text-align:right">
        <span class="pill ${u.status==='actif'?'p-stock':'p-attente'}">${u.status==='actif'?'Actif':'Inactif'}</span>
        ${canDo('gerant')&&u.role!=='proprio'&&u.id!==ME?.id?`<div style="margin-top:4px"><button class="chip" onclick="disableUser(${u.id})">Désactiver</button></div>`:''}
      </div></div>`).join('')}</div>
    <div class="btn-row"><button class="btn btn-p" onclick="openSheet('invite')">Inviter quelqu'un</button></div>`;
  } catch(e){ $('teamBody').innerHTML=`<div class="empty">${e.message}</div>`; }
}

async function disableUser(id){
  if(!confirm('Désactiver cet utilisateur ?')) return;
  try {
    await api.post('/api/users/'+id+'/disable');
    toast('Utilisateur désactivé');
    renderTeam();
  } catch(e){ toast(e.message,true); }
}

/* ========================================================
   CONSOLE ÉDITEUR
   ======================================================== */
async function renderAdmin(){
  $('adminBody').innerHTML='<div class="pad"><h1>Boutiques</h1></div><div class="empty"><span class="spin dark"></span></div>';
  try {
    const res = await api.get('/api/admin/tenants');
    const tenants = res.tenants||res;
    const F=[['all','Toutes'],['attente','En attente'],['attente_paiement','Paiement'],['essai','Essai'],['actif','Actives'],['suspendu','Suspendues']];
    const L = adFilter==='all' ? tenants : tenants.filter(t=>t.status===adFilter);
    const totalDev = tenants.reduce((s,t)=>s+(t.device_count||0),0);
    const att = tenants.filter(t=>t.status==='attente'||t.status==='attente_paiement').length;
    $('adminBody').innerHTML=`<div class="pad"><h1>Boutiques</h1><p class="sub">Toutes les boutiques.</p></div>
    <div class="stats">
      <div class="stat"><span class="v">${tenants.length}</span><span class="l">Boutiques</span></div>
      <div class="stat"><span class="v">${totalDev}</span><span class="l">Appareils</span></div>
      <div class="stat"><span class="v">${tenants.filter(t=>t.status==='actif').length}</span><span class="l">Actives</span></div>
    </div>
    ${att?`<div class="alert warn" style="margin-top:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div><b>${att} inscription(s) en attente de validation</b></div></div>`:''}
    <div class="filters">${F.map(f=>`<button class="f ${adFilter===f[0]?'on':''}" onclick="adFilter='${f[0]}';renderAdmin()">${f[1]}</button>`).join('')}</div>
    <div class="list">${L.length?L.map(t=>`<div class="srow" onclick="openShop(${t.id})">
      ${mark(t.color||'#888',initials(t.name),42,15)}
      <div class="sb"><b>${t.name}</b><span>${t.city||'—'} · ${t.pdv_count||0} PDV · ${t.user_count||0} util. · ${t.device_count||0} appareils</span></div>
      <span class="pill ${(TST[t.status]||{c:'p-vendu'}).c}">${(TST[t.status]||{l:t.status}).l}</span></div>`).join(''):'<div class="empty">Aucune boutique.</div>'}</div>`;
  } catch(e){ $('adminBody').innerHTML=`<div class="pad"><h1>Boutiques</h1></div><div class="empty">${e.message}</div>`; }
}

async function openShop(id){
  shopId=id;
  $('shopDetail').innerHTML='<div class="empty"><span class="spin dark"></span></div>';
  MODE='admin'; cur='shop';
  document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));
  $('s-shop').classList.add('on');$('main').scrollTop=0;$('fab').style.display='none';
  renderHeader();renderNav();
  try {
    const res = await api.get('/api/admin/tenants/'+id);
    const t = res.tenant||res;
    $('shopDetail').innerHTML=`<div class="dhead">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:10px">
        ${mark(t.color||'#888',initials(t.name),46,17)}
        <div><h1 style="margin:0">${t.name}</h1><div style="font-size:13px;color:var(--ink-2)">${t.city||'—'} · inscrit le ${fmtDate(t.created_at)}</div></div></div>
      <span class="pill ${(TST[t.status]||{c:'p-vendu'}).c}">${(TST[t.status]||{l:t.status}).l}</span>
      ${t.plan?`<span class="pill p-vendu">${t.plan}</span>`:''}
    </div>
    <div class="card"><div class="card-h">Usage</div>
      <dl class="kv"><dt>Points de vente</dt><dd>${(t.pdvs||[]).map(p=>p.name||p).join(', ')||'—'}</dd></dl>
      <dl class="kv"><dt>Utilisateurs</dt><dd>${t.user_count||0}</dd></dl>
      <dl class="kv"><dt>Appareils</dt><dd>${t.device_count||0}</dd></dl>
      <dl class="kv"><dt>Téléphone</dt><dd>${t.phone||'—'}</dd></dl>
    </div>
    ${t.status==='attente'||t.status==='attente_paiement'
      ?`<div class="btn-row"><button class="btn btn-s" onclick="suspendShop(${id})">Refuser</button><button class="btn btn-p" onclick="openSheet('pay')">Encaisser et activer</button></div>`
      :t.status==='suspendu'
      ?`<div class="btn-row"><button class="btn btn-s" onclick="suspendShop(${id})">Relancer</button><button class="btn btn-p" onclick="openSheet('pay')">Encaisser et réactiver</button></div>`
      :`<div class="btn-row"><button class="btn btn-s" onclick="suspendShop(${id})">Suspendre</button><button class="btn btn-p" onclick="openSheet('pay')">Enregistrer un paiement</button></div>`}`;
  } catch(e){ $('shopDetail').innerHTML=`<div class="empty">${e.message}</div>`; }
}

async function suspendShop(id){
  try { await api.post('/api/admin/tenants/'+id+'/suspend'); toast('Boutique suspendue'); openShop(id); }
  catch(e){ toast(e.message,true); }
}

function openPaySheet(){
  return `<h3>Enregistrer un paiement</h3>
  <div class="field"><label>Durée</label>
    <div class="seg">${[1,3,12].map(m=>`<button class="${payMonths===m?'on':''}" onclick="payMonths=${m};refreshPay()">${m} mois</button>`).join('')}</div>
    ${payMonths===12?'<p class="hint">Remise annuelle 15 % appliquée.</p>':''}</div>
  <div class="field"><label>Référence paiement</label><input id="payRef" placeholder="VIR-2026-0912"></div>
  <div class="btn-row"><button class="btn btn-s" onclick="closeSheet()">Annuler</button>
    <button class="btn btn-p" onclick="confirmPay()">Valider et activer</button></div>`;
}
function refreshPay(){ $('sheet').innerHTML=openPaySheet(); }

async function confirmPay(){
  const ref=($('payRef')||{}).value||'';
  try {
    await api.post('/api/admin/tenants/'+shopId+'/payments',{months:payMonths,reference:ref,payment_method:['virement','d17','especes'][payMode]});
    closeSheet(); toast('Paiement enregistré — boutique activée'); openShop(shopId);
  } catch(e){ toast(e.message,true); }
}

/* ========================================================
   ONBOARDING
   ======================================================== */
function renderOnboard(){
  [1,2,3].forEach(i=>$('ob'+i).classList.toggle('on',i<=obStep));
  let h='';
  if(obStep===1){
    const OBCOL=[["#0F5E5C","#E2F0EE"],["#2B4B8C","#E5EAF6"],["#8C3A2B","#F7E7E3"],["#1F6B3A","#E3F1E8"],["#8C6A1B","#F8EFDC"],["#5B3A8C","#ECE6F6"]];
    h=`<div class="pad"><h1>Crée ta boutique</h1><p class="sub">Étape 1 sur 3</p></div>
    <div class="field"><label>Nom</label><input id="obNameI" value="${obName}" placeholder="Phone House" oninput="obName=this.value"></div>
    <div class="field"><label>Ville</label><input id="obCity" placeholder="Sousse"></div>
    <div class="field"><label>Téléphone de la boutique</label><input id="obPhone" inputmode="tel" placeholder="73 000 000"></div>
    <div class="field"><label>Couleur</label>
      <div style="display:flex;gap:9px;flex-wrap:wrap">${OBCOL.map((c,i)=>`<div style="width:42px;height:42px;border-radius:11px;cursor:pointer;border:3px solid ${obCol===i?'#131C26':'transparent'};background:${c[0]}" onclick="obCol=${i};renderOnboard()"></div>`).join('')}</div></div>
    <div class="btn-row"><button class="btn btn-p" onclick="if(!obName){toast('Nom requis',true);}else{obStep=2;renderOnboard();}">Continuer</button></div>`;
  }
  if(obStep===2){
    h=`<div class="pad"><h1>Points de vente</h1><p class="sub">Étape 2 sur 3</p></div>
    <div class="list">${obPdvs.map((x,i)=>`<div class="urow"><div class="av">${i+1}</div><div class="ub"><b>${x}</b></div>
      ${obPdvs.length>1?`<button class="chip" onclick="obPdvs.splice(${i},1);renderOnboard()">Retirer</button>`:''}</div>`).join('')}</div>
    <div class="btn-row" style="margin-bottom:0"><button class="btn btn-s" onclick="obPdvs.push('Point de vente '+(obPdvs.length+1));renderOnboard()">+ Ajouter</button></div>
    <div class="btn-row"><button class="btn btn-s" onclick="obStep=1;renderOnboard()">Retour</button><button class="btn btn-p" onclick="obStep=3;renderOnboard()">Continuer</button></div>`;
  }
  if(obStep===3){
    h=`<div class="pad"><h1>Compte propriétaire</h1><p class="sub">Étape 3 sur 3 — ton numéro et ton code</p></div>
    <div class="field"><label>Ton numéro de téléphone</label><input id="obOwnerPhone" inputmode="tel" placeholder="98 000 000"></div>
    <div class="field"><label>Code à 4 chiffres</label><input id="obOwnerPin" inputmode="numeric" maxlength="4" placeholder="1234" type="password"></div>
    <div class="alert good" style="margin-top:0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg><div><b>14 jours d'essai, sans carte</b>Jusqu'à 30 appareils.</div></div>
    <div class="btn-row"><button class="btn btn-s" onclick="obStep=2;renderOnboard()">Retour</button><button class="btn btn-p" id="btnFinOb" onclick="finishOnboard()">Créer ma boutique</button></div>`;
  }
  $('obBody').innerHTML=h;
}

async function finishOnboard(){
  const btn=$('btnFinOb'); if(btn) btn.disabled=true;
  const OBCOL=[["#0F5E5C","#E2F0EE"],["#2B4B8C","#E5EAF6"],["#8C3A2B","#F7E7E3"],["#1F6B3A","#E3F1E8"],["#8C6A1B","#F8EFDC"],["#5B3A8C","#ECE6F6"]];
  try {
    const phone=($('obOwnerPhone')||{}).value||'';
    const pin=($('obOwnerPin')||{}).value||'';
    const city=($('obCity')||{}).value||'';
    const shopPhone=($('obPhone')||{}).value||'';
    if(!phone||!pin){ toast('Numéro et code requis',true); if(btn) btn.disabled=false; return; }
    const data = await api.post('/api/signup',{
      name: obName,
      city,
      phone: shopPhone,
      color: OBCOL[obCol][0],
      soft_color: OBCOL[obCol][1],
      pdvs: obPdvs,
      owner_phone: phone.replace(/\s/g,''),
      owner_pin: pin,
      owner_name: obName+' Propriétaire',
    });
    TOKEN = data.token;
    localStorage.setItem('so_token', TOKEN);
    await loadMe();
    go('home');
    toast('Boutique créée — bienvenue !');
  } catch(e){
    toast(e.message,true);
    if(btn) btn.disabled=false;
  }
}

/* ========================================================
   SHEETS
   ======================================================== */
function openSheet(k){
  let h='';
  if(k==='new'){
    h=`<h3>Nouvel enregistrement</h3>
    <button class="opt" onclick="startAcq()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><div><b>Entrée de stock</b><span>Achat fournisseur ou reprise à un particulier</span></div></button>
    <button class="opt" onclick="startSale()"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M6 2l1.5 5h13L19 16H8L6 2zM9 21h.01M18 21h.01"/></svg><div><b>Vente</b><span>Encaisser et créer le bon de garantie</span></div></button>
    <button class="opt" onclick="closeSheet();go('warranty')"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round"><path d="M12 3l7 3v6c0 4.4-3 7.6-7 9-4-1.4-7-4.6-7-9V6z"/></svg><div><b>Retour SAV</b><span>Appareil qui revient sous garantie</span></div></button>`;
  }
  if(k==='pdv'){
    const pdvList = ME?.pdvs||[];
    h=`<h3>Point de vente</h3>${pdvList.map(p=>`<button class="opt ${pdvId===p.id?'on':''}" onclick="pdvId=${p.id};pdvName='${p.name}';closeSheet();renderHeader()"><div><b>${p.name}</b></div></button>`).join('')}`;
  }
  if(k==='scan'){
    h=`<h3>Scanner l'IMEI</h3>
    <div id="qr-reader" style="width:100%;border-radius:12px;overflow:hidden;background:#111;"></div>
    <p class="note" style="text-align:center;margin:10px 0 4px">Vise le code-barres IMEI ou le QR code</p>
    <div class="btn-row" style="margin-top:8px"><button class="btn btn-s" onclick="stopScan()">Annuler</button></div>`;
  }
  if(k==='invite'){
    h=`<h3>Inviter un collaborateur</h3>
    <div class="field"><label>Numéro</label><input id="invPhone" inputmode="tel" placeholder="20 000 000"></div>
    <div class="field"><label>Rôle</label><select id="invRole"><option value="vendeur">Vendeur</option><option value="stock">Responsable stock</option><option value="gerant">Gérant</option>${ME?.role==='proprio'?'<option value="proprio">Propriétaire</option>':''}</select></div>
    <div class="btn-row"><button class="btn btn-s" onclick="closeSheet()">Annuler</button><button class="btn btn-p" onclick="sendInvite()">Envoyer</button></div>`;
  }
  if(k==='pay'){ h=openPaySheet(); }
  $('sheet').innerHTML=h;
  $('sheetBg').classList.add('on');
  // Démarrer le vrai scanner après rendu du DOM
  if(k==='scan'){
    setTimeout(()=>{
      if(typeof Html5Qrcode === 'undefined'){ toast('Scanner non disponible — saisie manuelle',true); closeSheet(); return; }
      qrScanner = new Html5Qrcode('qr-reader');
      qrScanner.start(
        {facingMode:'environment'},
        {fps:10, qrbox:{width:250,height:80}, aspectRatio:1.5},
        (text)=>{
          // Succès — extraire les chiffres (IMEI = 15 chiffres)
          const digits = text.replace(/\D/g,'');
          if(digits.length>=14){
            stopScan();
            // Injecter dans le champ IMEI actif
            if($('acqImei')){ $('acqImei').value=digits; acqData.imei=digits; }
            else if($('heroSearch')){ $('heroSearch').value=digits; heroSearchFn(digits); }
            toast('IMEI lu : '+digits.slice(0,15));
          }
        },
        ()=>{} // erreur de frame ignorée
      ).catch(err=>{
        stopScan();
        toast('Caméra inaccessible — saisie manuelle',true);
      });
    },200);
  }
}

async function sendInvite(){
  const phone=($('invPhone')||{}).value||'';
  const role=($('invRole')||{}).value||'vendeur';
  if(!phone){ toast('Numéro requis',true); return; }
  try {
    await api.post('/api/users',{phone:phone.replace(/\s/g,''),role,pdv_id:pdvId||undefined});
    closeSheet(); toast('Invitation envoyée — code provisoire généré'); renderTeam();
  } catch(e){ toast(e.message,true); }
}

let qrScanner = null;

function stopScan(){
  if(qrScanner){ qrScanner.stop().catch(()=>{}); qrScanner=null; }
  closeSheet();
}

function closeSheet(){
  if(qrScanner){ qrScanner.stop().catch(()=>{}); qrScanner=null; }
  $('sheetBg').classList.remove('on');
}

/* ========================================================
   INIT
   ======================================================== */
async function init(){
  if(TOKEN){
    await loadMe();
    if(ME){
      const firstTab = R().tabs[0];
      go(firstTab);
      return;
    }
  }
  go('auth');
}

init();
</script>
