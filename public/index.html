<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wael Scents — Poste de confirmation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8E6E1;
  --card:#FFFFFF;
  --ink:#15140F;
  --ink2:#4F4C43;
  --ink3:#7E7A6F;
  --rule:#CBC7BC;
  --rule2:#E1DED5;
  --or:#A8873F;
  --or-clair:#EFE7D5;
  --vert:#2E6B4F;
  --vert-fond:#E4EEE7;
  --ambre:#9A6512;
  --ambre-fond:#F6ECD9;
  --rouge:#8C2027;
  --rouge-fond:#F6E4E3;
  --radius:3px;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --serif:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}

.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--ink);color:#D6D2C6;padding:20px 0 22px;display:flex;flex-direction:column;gap:24px}

/* identité — remplacer par <img src="logo.svg" alt="Wael Scents" height="34"> */
.brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.09)}
.brand{text-align:center}
.logo{display:block;width:138px;height:auto;margin:0 auto 11px}
.brand span{font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:#8C8779;font-family:var(--cond)}

.nav{display:flex;flex-direction:column}
.nav button{background:none;border:0;text-align:left;padding:9px 20px;color:#A9A497;display:flex;align-items:center;gap:10px;border-left:3px solid transparent}
.nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav button[aria-current="true"]{color:#fff;border-left-color:var(--or);background:rgba(168,135,63,.14)}
.nav .k{font-family:var(--mono);font-size:11px;color:#6C6860;width:14px}
.nav .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:#8C8779}

.flux{margin-top:auto;padding:0 20px}
.flux .box{border:1px solid rgba(255,255,255,.12);border-radius:var(--radius);padding:11px 13px}
.flux h3{font-family:var(--cond);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:#8C8779;margin:0 0 8px;display:flex;align-items:center;gap:7px}
.live{width:7px;height:7px;border-radius:50%;background:#5FAE84;animation:pulse 1.8s infinite;display:inline-block}
@keyframes pulse{50%{opacity:.2}}
.flux p{margin:0;font-size:12px;color:#A9A497;font-family:var(--mono)}
.flux b{color:#fff;font-weight:500}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);border-bottom:1px solid var(--rule);padding:13px 26px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.topbar h1{font-family:var(--cond);font-size:19px;font-weight:700;margin:0}
.topbar .date{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.jauge{margin-left:auto;display:flex;align-items:center;gap:12px;min-width:210px}
.jauge .bar{flex:1;height:5px;background:var(--rule2);border-radius:99px;overflow:hidden}
.jauge .bar i{display:block;height:100%;background:var(--vert);transition:width .35s ease}
.jauge span{font-family:var(--mono);font-size:12px;color:var(--ink2);white-space:nowrap}

.screen{padding:24px 26px 40px;flex:1;min-width:0}
.eyebrow{font-family:var(--cond);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin:0 0 11px}
h2{font-family:var(--cond);font-size:22px;font-weight:700;margin:0 0 4px}
h3.sec{font-family:var(--cond);font-size:14px;letter-spacing:.06em;text-transform:uppercase;margin:26px 0 10px;color:var(--ink2)}
.sub{color:var(--ink2);margin:0 0 20px;max-width:64ch}

.appel{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:20px;align-items:start}
.fiche{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);position:relative;overflow:hidden}
.fiche::before{content:"";position:absolute;top:0;bottom:0;left:0;width:4px;background:var(--vert)}
.fiche.t2::before{background:var(--ambre)}
.fiche-head{padding:15px 20px 13px 24px;border-bottom:1px solid var(--rule2);display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap}
.fiche-head .num{font-family:var(--mono);font-size:20px;font-weight:600}
.fiche-head .meta{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.tag{font-family:var(--cond);font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:2px;font-weight:600;display:inline-block}
.tag.t{background:var(--ambre-fond);color:var(--ambre)}
.tag.h{background:var(--rouge-fond);color:var(--rouge)}
.tag.ok{background:var(--vert-fond);color:var(--vert)}
.tag.st{background:var(--or-clair);color:var(--or)}
.chrono{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.chrono i{width:6px;height:6px;border-radius:50%;background:var(--vert);animation:pulse 1.6s infinite}

.tel{padding:18px 24px;border-bottom:1px solid var(--rule2);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tel a.num{font-family:var(--mono);font-size:32px;font-weight:500;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--or);padding-bottom:2px}
.tel a.num:hover{color:var(--or)}
.tel .who{font-size:15px;font-weight:500}
.tel .who span{display:block;font-size:12px;color:var(--ink3);font-weight:400}
.wa{margin-left:auto;font-size:12px;color:var(--vert);text-decoration:none;border:1px solid var(--vert-fond);background:var(--vert-fond);padding:6px 11px;border-radius:99px}

.grid2{display:grid;grid-template-columns:1fr 1fr}
.bloc{padding:15px 24px;border-bottom:1px solid var(--rule2)}
.bloc + .bloc{border-left:1px solid var(--rule2)}
.bloc h4{font-family:var(--cond);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:0 0 9px;font-weight:600}
.ligne{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:13px;align-items:baseline}
.ligne .q{font-family:var(--mono);color:var(--ink3)}
.adr{font-size:13px;line-height:1.55}
.adr .rep{color:var(--ambre);font-size:12px;margin-top:5px;display:block}
.champ{display:flex;align-items:center;gap:9px;margin-top:11px}
.champ label{font-family:var(--cond);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3)}
select,input[type=text]{font:inherit;padding:7px 9px;border:1px solid var(--rule);border-radius:var(--radius);background:var(--card);max-width:100%}
.hint{background:var(--or-clair);border-left:3px solid var(--or);padding:10px 14px;font-size:13px;color:#6B551F}
.hint b{color:var(--ink)}
.total{padding:13px 24px;display:flex;justify-content:space-between;align-items:baseline;background:#F5F3EE;border-bottom:1px solid var(--rule2)}
.total em{font-style:normal;font-family:var(--cond);font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
.total b{font-family:var(--mono);font-size:24px;font-weight:600}

.actions{padding:15px 24px;display:flex;gap:9px;flex-wrap:wrap}
.btn{border:1px solid var(--rule);background:var(--card);padding:10px 15px;border-radius:var(--radius);display:inline-flex;align-items:center;gap:9px;font-weight:500}
.btn:hover{border-color:var(--ink3)}
.btn .cap{font-family:var(--mono);font-size:11px;font-weight:600;padding:2px 6px;border-radius:2px;border:1px solid currentColor;opacity:.5}
.btn.ok{background:var(--vert);border-color:var(--vert);color:#fff}
.btn.ok:hover{background:#245740}
.btn.warn{color:var(--ambre);border-color:#DCC79C;background:var(--ambre-fond)}
.btn.bad{color:var(--rouge);border-color:#DCBBBA;background:var(--rouge-fond)}
.btn.ghost{color:var(--ink2)}
.btn.or{background:var(--or);border-color:var(--or);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 11px;font-size:12.5px}

.pile{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius)}
.pile h4{font-family:var(--cond);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:0;padding:12px 15px;border-bottom:1px solid var(--rule2)}
.pile ol{list-style:none;margin:0;padding:6px 0;max-height:58vh;overflow:auto}
.pile li{padding:7px 15px;display:flex;gap:9px;align-items:baseline;font-size:13px;border-left:3px solid transparent}
.pile li.cur{background:#F5F2EA;border-left-color:var(--or);font-weight:500}
.pile li .n{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.pile li .v{margin-left:auto;font-size:11px;color:var(--ink3);font-family:var(--mono)}

.motifs{padding:13px 24px;border-top:1px solid var(--rule2);background:#FAF9F6}
.motifs .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.chip{border:1px solid var(--rule);background:var(--card);padding:7px 12px;border-radius:99px;font-size:13px}
.chip:hover{border-color:var(--ink3)}

table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius)}
th{font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:10px 13px;border-bottom:1px solid var(--rule);font-weight:600}
td{padding:10px 13px;border-bottom:1px solid var(--rule2);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAF9F6}
.m{font-family:var(--mono)}
.right{text-align:right}

/* étiquettes au format réel : cadre + nom en capitales */
.planche{display:flex;flex-wrap:wrap;gap:9px;margin:14px 0 20px}
.etq{width:206px;height:104px;background:#fff;border:1px solid var(--rule2);border-radius:2px;padding:7px;box-shadow:0 1px 0 rgba(0,0,0,.05)}
.etq .frame{width:100%;height:100%;border:2.5px solid #15140F;display:grid;place-items:center;text-align:center;padding:4px 6px}
.etq .frame span{font-family:var(--cond);font-weight:700;font-size:17px;line-height:1.08;text-transform:uppercase}
.etq.vide{border-style:dashed;display:grid;place-items:center;color:var(--ink3);font-size:12px;font-family:var(--mono);box-shadow:none}

.lot{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:13px 16px;display:flex;align-items:center;gap:14px;margin-bottom:-1px}
.lot .qte{font-family:var(--mono);font-size:22px;font-weight:600;width:44px}
.lot .nm{font-family:var(--cond);font-size:15.5px;text-transform:uppercase}
.lot .rec{font-size:12px;color:var(--ink3);font-family:var(--mono)}
.lot .src{margin-left:auto;font-size:11.5px;font-family:var(--cond);letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:2px;white-space:nowrap}
.src.stk{background:var(--or-clair);color:var(--or)}
.src.prod{background:var(--vert-fond);color:var(--vert)}

.queue{margin-top:14px}
.qrow{display:flex;align-items:center;gap:13px;padding:9px 13px;background:var(--card);border:1px solid var(--rule);border-top:0;font-size:13px}
.qrow:first-child{border-top:1px solid var(--rule)}
.qrow .st{margin-left:auto;font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:2px}
.st.att{background:var(--rule2);color:var(--ink2)}
.st.env{background:var(--ambre-fond);color:var(--ambre)}
.st.imp{background:var(--vert-fond);color:var(--vert)}

.gouv{margin-bottom:22px}
.gouv > h4{font-family:var(--cond);font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin:0 0 9px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.dels{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
.del{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);display:flex;flex-direction:column}
.del.aff{border-color:var(--vert);box-shadow:inset 3px 0 0 var(--vert)}
.del header{padding:11px 14px;border-bottom:1px solid var(--rule2)}
.del header b{font-family:var(--cond);font-size:15px}
.del header span{display:block;font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.del ul{list-style:none;margin:0;padding:6px 0;flex:1}
.del li{padding:5px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.del li .n{font-family:var(--mono);color:var(--ink3);font-size:11.5px}
.del li select{font-size:11px;padding:2px 4px;margin-left:auto;max-width:110px;border-color:var(--rule2)}
.del footer{padding:10px 14px;border-top:1px solid var(--rule2);display:flex;gap:8px;align-items:center}
.del footer select{flex:1;min-width:0;font-size:12.5px;padding:6px 8px}

.bilan{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.bil{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:12px 14px}
.bil b{font-family:var(--cond);font-size:14.5px;display:block}
.bil span{font-family:var(--mono);font-size:12px;color:var(--ink3)}

.bordereau{margin-top:16px;background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:17px;display:flex;gap:18px;align-items:flex-start;max-width:520px;flex-wrap:wrap}
.bordereau .info h5{font-family:var(--cond);font-size:15px;margin:0 0 6px}
.bordereau .info p{margin:0 0 3px;font-size:12.5px;color:var(--ink2)}
.bordereau .info .mt{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--ink);margin-top:8px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:13px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);padding:14px 16px}
.stat em{font-style:normal;font-family:var(--cond);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.stat b{display:block;font-family:var(--mono);font-size:29px;font-weight:500;margin-top:4px;line-height:1}
.stat small{color:var(--ink3);font-size:12px}
.etapes{background:var(--card);border:1px solid var(--rule);border-radius:var(--radius)}
.etape{display:flex;align-items:center;gap:13px;padding:13px 17px;border-bottom:1px solid var(--rule2);flex-wrap:wrap}
.etape:last-child{border-bottom:0}
.etape .idx{font-family:var(--mono);font-size:12px;color:var(--ink3);width:18px}
.etape .txt b{display:block;font-family:var(--cond);font-size:15px}
.etape .txt span{font-size:12.5px;color:var(--ink2)}
.etape .go{margin-left:auto}

.depot{border:1px dashed var(--rule);background:var(--card);border-radius:var(--radius);padding:26px;text-align:center;margin-bottom:18px}
.depot b{font-family:var(--cond);font-size:16px;display:block;margin-bottom:5px}
.depot p{margin:0 0 14px;color:var(--ink2);font-size:13px}
.switch{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);margin-top:14px}
.vide{background:var(--card);border:1px dashed var(--rule);border-radius:var(--radius);padding:38px 22px;text-align:center}
.vide b{display:block;font-family:var(--cond);font-size:18px;margin-bottom:6px}
.vide p{margin:0 0 15px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--radius);font-size:13.5px;transition:.22s ease;z-index:50;box-shadow:0 6px 22px rgba(0,0,0,.25);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.note{margin-top:24px;font-size:12.5px;color:var(--ink3);border-top:1px solid var(--rule);padding-top:11px;max-width:74ch}

@media (max-width:1000px){
  .app{grid-template-columns:1fr}
  .rail{flex-direction:row;align-items:center;gap:12px;padding:10px 14px;overflow-x:auto}
  .brand{border-bottom:0;padding:0 12px 0 0;flex:none}
  .brand span{display:none}
  .logo{width:84px;margin:0}
  .flux{display:none}
  .nav{flex-direction:row}
  .nav button{border-left:0;border-bottom:3px solid transparent;padding:7px 11px;white-space:nowrap}
  .nav button[aria-current="true"]{border-left-color:transparent;border-bottom-color:var(--or)}
  .appel{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .bloc + .bloc{border-left:0}
  .screen{padding:16px 13px 34px}
  .tel a.num{font-size:25px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* v3 */
.champ.req{background:var(--rouge-fond);padding:9px 11px;border-radius:var(--radius);border:1px solid #DCBBBA;flex-wrap:wrap}
.srcbadge{font-size:11px;font-family:var(--mono);color:var(--ink3)}
.lot .btn{margin-left:12px}
.banniere{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--or);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.banniere b{font-family:var(--cond);font-size:14.5px}
.banniere .go{margin-left:auto}
.sousnav{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--rule)}
.sousnav button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;color:var(--ink3);font-family:var(--cond);font-size:13.5px;letter-spacing:.05em;text-transform:uppercase}
.sousnav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--or)}
.pastille{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px}
.p-tournee{background:var(--ambre)}.p-livre{background:var(--vert)}.p-echec{background:var(--rouge)}
</style>
</head>
<body>

<div class="app">

const MOTIFS_RAPPEL = ["Ne repond pas","Occupe","Demande a etre rappele","Telephone eteint"];
const SEUIL_FRANCO = 150;

let tab = "journee", curIdx = 0, panel = null, t0 = Date.now();
let bord = {}, file = [], delegations = [], livreurs = [], plan = null, colis = [], suivi = [];
let sousOnglet = "interne", chargement = false;

const dt = n => (Number(n) || 0).toFixed(3).replace(".", ",") + " DT";
function toast(m, err) {
  const t = $("#toast"); t.textContent = m;
  t.style.background = err ? "#8C2027" : "#15140F";
  t.classList.add("on"); clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), 2600);
}

async function charger() {
  chargement = true;
  try {
    bord = await api("/api/tableau-de-bord");
    if (!delegations.length) delegations = await api("/api/delegations");
    if (!livreurs.length) livreurs = await api("/api/livreurs");
    if (tab === "appels" || tab === "journee") file = await api("/api/commandes");
    if (tab === "prepa" || tab === "journee") plan = await api("/api/preparation/plan");
    if (tab === "affectation") colis = await api("/api/affectation/colis");
    if (tab === "suivi") suivi = await api("/api/suivi");
  } catch (e) { toast("Erreur de chargement : " + e.message, true); }
  chargement = false;
  rendre();
}

function compteurs() {
  $("#nAppels").textContent = bord.a_appeler ?? 0;
  $("#nPrep").textContent   = bord.a_preparer ?? 0;
  $("#nAff").textContent    = bord.a_affecter ?? 0;
  const el = $("#nSuivi"); if (el) el.textContent = bord.en_tournee ?? 0;
  $("#fluxN").textContent   = bord.recues ?? 0;
  const total = bord.recues || 0, traite = total - (bord.a_appeler || 0);
  $("#jaugeBar").style.width = (total ? Math.round(traite / total * 100) : 0) + "%";
  $("#jaugeTxt").textContent = traite + " / " + total + " traitees";
}

/* ------------------------------ 1. Journee ------------------------------ */
function vueJournee() {
  if (!bord.recues) return '<p class="eyebrow">Vue d\'ensemble</p>'
    + '<div class="vide"><b>Aucune commande pour l\'instant.</b>'
    + '<p>Les commandes de waelscents.com arriveront ici automatiquement, en quelques secondes.</p>'
    + '<button class="btn" data-act="rafraichir">Rafraichir</button></div>';

  const produire = plan ? plan.produire.length : 0;
  const puise = plan ? plan.puise.length : 0;
  return '<p class="eyebrow">Vue d\'ensemble</p><h2>Ce qu\'il reste a faire</h2>'
  + '<p class="sub">Les commandes arrivent de waelscents.com en temps reel. Traite-les dans l\'ordre : appeler, preparer, affecter.</p>'
  + '<div class="stats">'
  + '<div class="stat"><em>Commandes recues</em><b>' + bord.recues + '</b><small>total en base</small></div>'
  + '<div class="stat"><em>Confirmees</em><b>' + bord.confirmees + '</b><small>' + dt(bord.ca_confirme) + '</small></div>'
  + '<div class="stat"><em>Flacons prets en stock</em><b>' + bord.flacons + '</b><small>issus de retours</small></div>'
  + '<div class="stat"><em>Reste a appeler</em><b>' + bord.a_appeler + '</b><small>dont ' + bord.injoignables + ' en 2e tentative</small></div>'
  + '</div><div class="etapes">'
  + '<div class="etape"><span class="idx">01</span><span class="txt"><b>Appeler les clients</b><span>' + bord.a_appeler + ' commande(s) a confirmer</span></span><span class="go"><button class="btn ok" data-goto="appels"' + (bord.a_appeler ? "" : " disabled") + '>Commencer les appels</button></span></div>'
  + '<div class="etape"><span class="idx">02</span><span class="txt"><b>Fabriquer et etiqueter</b><span>' + produire + ' flacon(s) a fabriquer &middot; ' + puise + ' puise(s) du stock</span></span><span class="go"><button class="btn" data-goto="prepa"' + (bord.a_preparer ? "" : " disabled") + '>Ouvrir la preparation</button></span></div>'
  + '<div class="etape"><span class="idx">03</span><span class="txt"><b>Affecter par delegation</b><span>' + bord.a_affecter + ' colis pret(s)</span></span><span class="go"><button class="btn" data-goto="affectation"' + (bord.a_affecter ? "" : " disabled") + '>Ouvrir l\'affectation</button></span></div>'
  + '<div class="etape"><span class="idx">04</span><span class="txt"><b>Suivre les livraisons</b><span>' + bord.en_tournee + ' colis en tournee</span></span><span class="go"><button class="btn" data-goto="suivi">Ouvrir le suivi</button></span></div>'
  + '</div>';
}

/* ------------------------------- 2. Appels ------------------------------ */
function vueAppels() {
  if (!file.length) return '<p class="eyebrow">File d\'appels</p>'
    + '<div class="vide"><b>Personne a appeler.</b><p>Toutes les commandes recues sont traitees.</p>'
    + '<button class="btn" data-act="rafraichir">Rafraichir</button></div>';

  if (curIdx >= file.length) curIdx = 0;
  const o = file[curIdx];
  const t2 = o.statut_confirmation === "INJOIGNABLE";
  const gt = o.interne === 1;
  const manque = SEUIL_FRANCO - Number(o.montant_cod || 0);

  const liste = file.map((x, i) => '<li class="' + (i === curIdx ? "cur" : "") + '"><span class="n">' + x.numero + '</span> ' + x.client
    + '<span class="v">' + (x.statut_confirmation === "INJOIGNABLE" ? "tent. " + x.nb_tentatives : (x.delegation || x.ville || "a definir")) + '</span></li>').join("");

  const arts = (o.articles || []).map(a => '<div class="ligne"><span>' + a.nom_etiquette + ' &middot; ' + (a.contenance || "") + '</span><span class="q">x' + a.quantite + '</span></div>').join("");

  const opts = delegations.map(d => '<option value="' + d.id + '"' + (d.id === o.delegation_id ? " selected" : "") + '>' + d.nom + '</option>').join("");
  let champDel;
  if (o.delegation_id) {
    champDel = '<div class="champ"><label for="delSel">Delegation</label><select id="delSel">' + opts + '</select>'
      + '<span class="srcbadge">' + (o.source_delegation === "DETECTEE" ? "detectee depuis l\'adresse" : "saisie") + '</span></div>';
  } else {
    champDel = '<div class="champ req"><label for="delSel">Delegation</label>'
      + '<select id="delSel"><option value="">Choisir...</option>' + opts + '</select>'
      + '<span class="srcbadge" style="color:var(--rouge)">non detectee &mdash; a saisir</span></div>';
  }

  let bloc = '<div class="actions">'
    + '<button class="btn ok" data-act="confirmer"><span class="cap">C</span> Confirmer</button>'
    + '<button class="btn warn" data-act="rappel"><span class="cap">R</span> Rappeler plus tard</button>'
    + '<button class="btn bad" data-act="annul"><span class="cap">A</span> Annuler</button>'
    + '<button class="btn ghost" data-act="suivant"><span class="cap">v</span> Passer</button></div>';
  if (panel) {
    const l = panel === "annul" ? MOTIFS_ANNUL : MOTIFS_RAPPEL;
    bloc = '<div class="motifs"><p class="eyebrow" style="margin:0">' + (panel === "annul" ? "Motif d\'annulation" : "Pourquoi le client n\'a pas confirme") + '</p><div class="row">'
      + l.map(m => '<button class="chip" data-motif="' + m + '">' + m + '</button>').join("")
      + '<button class="chip" data-motif="__retour" style="color:var(--ink3)">Retour</button></div></div>';
  }

  const adresse = [o.adresse1, o.adresse2].filter(Boolean).join(", ") || "adresse non fournie";
  const tel = o.telephone || "";

  return '<p class="eyebrow">File d\'appels &middot; ' + (curIdx + 1) + ' sur ' + file.length + '</p>'
  + '<div class="appel"><section class="fiche ' + (t2 ? "t2" : "") + '">'
  + '<div class="fiche-head"><div><div class="num">' + o.numero + '</div><div class="meta">'
  + (gt ? (o.delegation || "delegation a definir") + " &middot; livreur moto" : (o.delegation ? o.delegation : "hors Grand Tunis &middot; transporteur")) + '</div></div>'
  + (t2 ? '<span class="tag t">Tentative ' + o.nb_tentatives + '</span>' : "")
  + (o.nb_retours > 1 ? '<span class="tag h">' + o.nb_retours + ' retours</span>' : "")
  + (o.nb_commandes >= 4 ? '<span class="tag ok">Fidele &middot; ' + o.nb_commandes + ' commandes</span>' : "")
  + '<div class="chrono"><i></i><span id="chrono">00:00</span></div></div>'
  + '<div class="tel">' + (tel ? '<a class="num" href="tel:' + tel.replace(/\s/g, "") + '">' + tel + '</a>' : '<span class="num" style="color:var(--rouge)">telephone manquant</span>')
  + '<div class="who">' + o.client + '<span>' + (o.nb_commandes || 0) + ' commande(s) &middot; ' + (o.nb_retours || 0) + ' retour(s)</span></div>'
  + (tel ? '<a class="wa" href="https://wa.me/' + tel.replace(/[^0-9]/g, "") + '" target="_blank" rel="noopener">WhatsApp</a>' : "") + '</div>'
  + (manque > 0 && manque < SEUIL_FRANCO ? '<div class="hint">Il manque <b>' + dt(manque) + '</b> pour la livraison offerte (' + SEUIL_FRANCO + ' DT).</div>' : "")
  + '<div class="grid2"><div class="bloc"><h4>Contenu du colis</h4>' + (arts || "<i>aucun article</i>") + '</div>'
  + '<div class="bloc"><h4>Adresse de livraison</h4><div class="adr">' + adresse
  + '<br><span class="srcbadge">Ville saisie : ' + (o.ville || "-") + '</span>'
  + (o.reperes ? '<span class="rep">Reperes : ' + o.reperes + '</span>' : "") + '</div>' + champDel + '</div></div>'
  + '<div class="total"><em>A encaisser a la livraison</em><b>' + dt(o.montant_cod) + '</b></div>' + bloc + '</section>'
  + '<aside class="pile"><h4>Reste a appeler (' + file.length + ')</h4><ol>' + liste + '</ol></aside></div>'
  + '<p class="note">Clavier : <b>C</b> confirmer &middot; <b>R</b> rappeler &middot; <b>A</b> annuler &middot; <b>fleche bas</b> passer. La delegation est obligatoire avant de confirmer.</p>';
}

async function agir(act, motif) {
  const o = file[curIdx];
  if (!o) return;
  try {
    if (act === "suivant") { curIdx = (curIdx + 1) % file.length; panel = null; rendre(); return; }
    if (act === "confirmer") {
      const sel = document.getElementById("delSel");
      const del = sel ? sel.value : o.delegation_id;
      if (!del) { toast("Choisis d'abord la delegation.", true); if (sel) sel.focus(); return; }
      await api("/api/commandes/" + o.id + "/confirmer", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ delegationId: del, texteSource: o.ville || "" })
      });
      toast(o.numero + " confirmee");
    } else if (act === "rappel") {
      if (!motif) { panel = "rappel"; rendre(); return; }
      await api("/api/commandes/" + o.id + "/rappeler", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ motif: motif, dansHeures: 4 })
      });
      toast(o.numero + " a rappeler");
    } else if (act === "annul") {
      if (!motif) { panel = "annul"; rendre(); return; }
      await api("/api/commandes/" + o.id + "/annuler", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ motif: motif })
      });
      toast(o.numero + " annulee");
    }
    panel = null;
    await charger();
  } catch (e) {
    toast(e.message === "delegation_obligatoire" ? "Delegation obligatoire pour le Grand Tunis." : ("Echec : " + e.message), true);
  }
}

/* ---------------------------- 3. Preparation ---------------------------- */
function vuePrepa() {
  if (!plan || (!plan.produire.length && !plan.puise.length))
    return '<p class="eyebrow">Preparation</p><div class="vide"><b>Rien a preparer.</b>'
      + '<p>Les commandes confirmees arrivent ici automatiquement.</p>'
      + '<button class="btn" data-goto="appels">Retour aux appels</button></div>';

  const lots = {};
  plan.produire.forEach(p => { const k = p.nom_etiquette + "|" + (p.contenance || ""); lots[k] = (lots[k] || 0) + 1; });

  const puises = plan.puise.map(p => '<div class="lot"><span class="qte">1</span>'
    + '<span><span class="nm">' + p.nom_etiquette + '</span><br><span class="rec">' + p.flacon.id + ' &middot; ' + p.flacon.origine + ' &middot; pour ' + p.numero + '</span></span>'
    + '<span class="src stk">Stock retours</span>'
    + '<button class="btn sm" data-introuvable="' + p.flacon.id + '">Introuvable</button></div>').join("");

  const aProd = Object.keys(lots).map(k => '<div class="lot"><span class="qte">' + lots[k] + '</span>'
    + '<span><span class="nm">' + k.split("|")[0] + '</span><br><span class="rec">' + (k.split("|")[1] || "") + '</span></span>'
    + '<span class="src prod">A fabriquer</span></div>').join("");

  const planche = plan.produire.slice(0, 8).map(p => '<div class="etq"><div class="frame"><span>' + p.nom_etiquette.toUpperCase() + '</span></div></div>').join("");
  const reste = plan.produire.length - 8;

  return '<p class="eyebrow">Preparation</p>'
  + '<h2>' + plan.produire.length + ' flacons a fabriquer, ' + plan.puise.length + ' deja prets</h2>'
  + '<p class="sub">Les flacons revenus d\'une livraison echouee sont reutilises en priorite : ni fabrication, ni etiquette.</p>'
  + (puises ? '<h3 class="sec">Puises du stock de retours</h3>' + puises : "")
  + (aProd ? '<h3 class="sec">A fabriquer &mdash; regroupe par parfum</h3>' + aProd : "")
  + (plan.produire.length ? '<h3 class="sec">Etiquettes a imprimer (' + plan.produire.length + ')</h3><div class="planche">' + planche
      + (reste > 0 ? '<div class="etq vide">+ ' + reste + ' autres</div>' : "") + '</div>' : "")
  + '<button class="btn ok" data-act="lancerPrepa">Fabriquer et mettre ' + plan.produire.length + ' etiquettes en file</button>'
  + '<p class="note">Les etiquettes partent dans la file d\'impression. Le poste du depot les recupere ; le simulateur permet de les verifier sans imprimante.</p>';
}

/* ---------------------------- 4. Affectation ---------------------------- */
function vueAffectation() {
  const gt = colis.filter(c => c.interne === 1);
  const hors = colis.filter(c => c.interne !== 1);
  const banniere = hors.length ? '<div class="banniere"><b>' + hors.length + ' colis hors Grand Tunis</b>'
    + '<span style="color:var(--ink2);font-size:13px">remis au transporteur</span></div>' : "";

  if (!gt.length) return '<p class="eyebrow">Affectation</p>' + banniere
    + '<div class="vide"><b>Aucun colis Grand Tunis a affecter.</b><p>Les colis arrivent ici une fois etiquetes.</p>'
    + '<button class="btn" data-goto="prepa">Aller a la preparation</button></div>';

  const dels = [...new Set(gt.map(c => c.delegation))].sort();
  const cartes = dels.map(d => {
    const items = gt.filter(c => c.delegation === d);
    const tot = items.reduce((s, c) => s + Number(c.montant_cod || 0), 0);
    return '<section class="del"><header><b>' + d + '</b><span>' + items.length + ' colis &middot; ' + dt(tot) + '</span></header>'
      + '<ul>' + items.map(c => '<li><span class="n">' + c.numero + '</span> ' + c.client.split(" ")[0]
      + '<span class="n" style="margin-left:auto">' + dt(c.montant_cod) + '</span></li>').join("") + '</ul>'
      + '<footer><select data-del="' + d + '"><option value="">Livreur...</option>'
      + livreurs.map(l => '<option value="' + l.id + '">' + l.nom + '</option>').join("")
      + '</select><button class="btn ok sm" data-affecter="' + d + '">Affecter</button></footer></section>';
  }).join("");

  return '<p class="eyebrow">Affectation &middot; Grand Tunis &middot; ' + gt.length + ' colis</p>'
  + '<h2>Repartir la tournee par delegation</h2>' + banniere + '<div class="dels">' + cartes + '</div>';
}

/* ------------------------------- 5. Suivi ------------------------------- */
function vueSuivi() {
  if (!suivi.length) return '<p class="eyebrow">Suivi des livraisons</p>'
    + '<div class="vide"><b>Aucun colis en circulation.</b><p>Les colis affectes a un livreur apparaitront ici.</p></div>';
  const rows = suivi.map(s => '<tr><td class="m">' + s.numero + '</td><td>' + (s.livreur || "-") + '</td>'
    + '<td>' + (s.delegation || "-") + '</td><td><span class="tag ' + (s.statut === "LIVREE" ? "ok" : "t") + '">' + s.statut + '</span></td>'
    + '<td class="m right">' + dt(s.montant_a_encaisser) + '</td></tr>').join("");
  return '<p class="eyebrow">Suivi des livraisons</p><h2>' + suivi.length + ' colis suivis</h2>'
  + '<table><thead><tr><th>Commande</th><th>Livreur</th><th>Delegation</th><th>Statut</th><th class="right">A encaisser</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

/* ------------------------------- rendu ---------------------------------- */
function rendre() {
  compteurs();
  document.querySelectorAll("#nav button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab));
  const t = { journee: "Journee", appels: "File d'appels", prepa: "Fabrication et etiquettes", affectation: "Affectation Grand Tunis", suivi: "Suivi des livraisons" };
  $("#titre").textContent = t[tab];
  const v = { journee: vueJournee, appels: vueAppels, prepa: vuePrepa, affectation: vueAffectation, suivi: vueSuivi };
  $("#screen").innerHTML = chargement ? '<div class="vide">Chargement...</div>' : v[tab]();
  if (tab === "appels") t0 = Date.now();
}

document.addEventListener("click", async e => {
  const nav = e.target.closest("#nav button");
  if (nav) { tab = nav.dataset.tab; panel = null; curIdx = 0; await charger(); return; }
  const go = e.target.closest("[data-goto]");
  if (go) { tab = go.dataset.goto; panel = null; curIdx = 0; await charger(); return; }
  const m = e.target.closest("[data-motif]");
  if (m) { if (m.dataset.motif === "__retour") { panel = null; rendre(); return; } agir(panel === "annul" ? "annul" : "rappel", m.dataset.motif); return; }
  const intr = e.target.closest("[data-introuvable]");
  if (intr) {
    try { await api("/api/flacons/" + intr.dataset.introuvable + "/introuvable", { method: "POST" });
      toast(intr.dataset.introuvable + " introuvable : bascule en fabrication"); await charger();
    } catch (err) { toast("Echec : " + err.message, true); } return;
  }
  const af = e.target.closest("[data-affecter]");
  if (af) {
    const sel = document.querySelector('select[data-del="' + af.dataset.affecter + '"]');
    if (!sel || !sel.value) { toast("Choisis un livreur.", true); return; }
    const ids = colis.filter(c => c.delegation === af.dataset.affecter).map(c => c.id);
    try {
      const r = await api("/api/affectation", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ courierId: sel.value, orderIds: ids }) });
      toast(r.affectes + " colis affectes"); await charger();
    } catch (err) { toast("Echec : " + err.message, true); } return;
  }
  const act = e.target.closest("[data-act]");
  if (act) {
    if (act.dataset.act === "rafraichir") { await charger(); return; }
    if (act.dataset.act === "lancerPrepa") {
      act.disabled = true;
      try { const r = await api("/api/preparation/lancer", { method: "POST" });
        toast(r.aImprimer + " etiquettes en file, " + r.puises + " puises du stock"); await charger();
      } catch (err) { toast("Echec : " + err.message, true); act.disabled = false; }
      return;
    }
    agir(act.dataset.act); return;
  }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input,select,textarea")) return;
  if (["1","2","3","4","5"].indexOf(e.key) >= 0) {
    tab = ["journee","appels","prepa","affectation","suivi"][+e.key - 1];
    panel = null; curIdx = 0; charger(); return;
  }
  if (tab !== "appels") return;
  if (e.key === "Escape" && panel) { panel = null; rendre(); return; }
  if (panel) return;
  const k = e.key.toLowerCase();
  if (k === "c") agir("confirmer");
  else if (k === "r") agir("rappel");
  else if (k === "a") agir("annul");
  else if (e.key === "ArrowDown") { e.preventDefault(); agir("suivant"); }
});

setInterval(() => {
  const c = document.getElementById("chrono");
  if (c) { const s = Math.floor((Date.now() - t0) / 1000);
    c.textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
}, 1000);

/* les nouvelles commandes Shopify apparaissent toutes seules */
setInterval(() => { if (!panel && !chargement) charger(); }, 15000);

charger();
</script>
</body>
</html>
